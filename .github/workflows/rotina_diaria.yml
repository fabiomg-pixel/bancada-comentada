name: Rotina Diária da Bancada Comentada

on:
  schedule:
    # 20:00 UTC = 17:00 Horário de Brasília (Segunda a Sexta)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  executar-rotina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Varredura e Atualização da Edição
        run: |
          python3 scripts/rotina_diaria_completa.py

      - name: Commitar e Publicar no GitHub Pages
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): edicao diaria da Bancada Comentada [skip ci]" && git push)
