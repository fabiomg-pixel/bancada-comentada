name: Rotina Diária da Bancada Comentada

# Desde 09/11/2026 este repositório é espelho da revista do claude.ai e não faz captura própria.
# A rotina dispara quando a tarefa "Espelho da Bancada no GitHub" grava o depósito do dia da v6
# em data/captura_v6/ (dias úteis, por volta das 18h45 de Brasília).
on:
  push:
    branches: [main]
    paths:
      - 'data/captura_v6/**'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  executar-rotina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Pipeline e Áudio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Importar o depósito da v6 e atualizar a edição
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/rotina_diaria_completa.py

      - name: Commitar e Publicar no GitHub Pages
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/ index.html audio/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): edicao diaria e audio da Bancada Comentada [skip ci]" && git push)
