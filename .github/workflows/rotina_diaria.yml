name: Rotina Diária da Bancada Comentada

on:
  schedule:
    # 20:00 UTC = 17:00 Horário de Brasília (Segunda a Sexta)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente pelo GitHub

jobs:
  executar-rotina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install requests urllib3

      - name: Executar Triagem e Atualização da Edição
        run: |
          python3 scripts/rotina_diaria_completa.py || true

      - name: Commitar e Publicar no GitHub Pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): atualizacao automatica da edicao diária" && git push)
